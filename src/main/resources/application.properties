spring.application.name=weather-activity-planner-api

#MySql
spring.datasource.url=jdbc:mysql://localhost:3306/apiweather
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

#Jpa

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Open-Meteo
open-meteo.geocoding.base-url=https://geocoding-api.open-meteo.com
open-meteo.forecast.base-url=https://api.open-meteo.com